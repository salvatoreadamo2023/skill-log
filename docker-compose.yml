services:
  mysql:
    image: mysql:8.4
    container_name: skilllog-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: skilllog
      MYSQL_USER: skilllog_user
      MYSQL_PASSWORD: Password123!
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - skilllog_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  skilllog_mysql_data:
