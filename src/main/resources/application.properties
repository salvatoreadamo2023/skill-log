spring.application.name=skilllog
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skilllog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:skilllog_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

openai.api.key=${OPENAI_API_KEY:}

jwt.secret=${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3Itand0LTI1Ni1iaXRzLTEyMzQ1Ng==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springdoc=${SPRINGDOC_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
